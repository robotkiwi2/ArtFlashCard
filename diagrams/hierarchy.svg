<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 190" width="320" height="190"><rect width="320" height="190" fill="#ffffff"/><text x="160" y="22" font-size="13" fill="#7a828c" text-anchor="middle" font-weight="normal" font-family="Malgun Gothic, sans-serif">크기·굵기·색의 차이가 읽는 순서를 만든다</text><text x="14" y="46" font-size="11" fill="#9aa3ad" text-anchor="start" font-weight="normal" font-family="Malgun Gothic, sans-serif">위계 없음</text><rect x="14" y="56" width="130" height="7" fill="#b8bfc7"/><rect x="14" y="71" width="130" height="7" fill="#b8bfc7"/><rect x="14" y="86" width="130" height="7" fill="#b8bfc7"/><rect x="14" y="101" width="130" height="7" fill="#b8bfc7"/><text x="176" y="46" font-size="11" fill="#9aa3ad" text-anchor="start" font-weight="normal" font-family="Malgun Gothic, sans-serif">위계 있음</text><rect x="176" y="54" width="104" height="15" fill="#1f2a36"/><rect x="176" y="76" width="72" height="9" fill="#5a6674"/><rect x="176" y="92" width="126" height="5" fill="#c3cad2"/><rect x="176" y="103" width="126" height="5" fill="#c3cad2"/><rect x="176" y="114" width="126" height="5" fill="#c3cad2"/><text x="14" y="152" font-size="11" fill="#9aa3ad" text-anchor="start" font-weight="normal" font-family="Malgun Gothic, sans-serif">다 같은 무게라 어디부터 볼지 알 수 없다</text><text x="14" y="170" font-size="11" fill="#c8451f" text-anchor="start" font-weight="normal" font-family="Malgun Gothic, sans-serif">무게가 다르면 눈이 큰 것부터 따라간다</text></svg>