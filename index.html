<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>임용미술 플래시카드</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>🎨 임용미술 플래시카드</h1>
  <nav>
    <button id="nav-setup" class="active">학습 설정</button>
    <button id="nav-stats">성적 관리</button>
  </nav>
</header>

<!-- ===== 학습 설정 화면 ===== -->
<section id="screen-setup">
  <div class="panel">
    <h2>범위 선택</h2>
    <div class="filter-grid">
      <div class="filter-block">
        <h3>과목 <span class="hint">하나만 선택 · 아래 항목이 해당 과목 것으로 갱신됩니다</span></h3>
        <div id="filter-subject" class="chip-group"></div>
      </div>
      <div class="filter-block">
        <h3>유형</h3>
        <div id="filter-type" class="chip-group"></div>
      </div>
      <div class="filter-block">
        <h3>시대</h3>
        <div id="filter-era" class="chip-group"></div>
      </div>
      <div class="filter-block">
        <h3>태그
          <span class="bulk">
            <button type="button" id="tag-all" class="mini">모두 선택</button>
            <button type="button" id="tag-none" class="mini">해제</button>
          </span>
        </h3>
        <div id="filter-tag" class="chip-group scroll"></div>
      </div>
      <div class="filter-block">
        <h3>중요도 (1=최상)</h3>
        <div id="filter-imp" class="chip-group"></div>
      </div>
    </div>
    <p id="pool-count" class="pool-count"></p>
  </div>

  <div class="panel">
    <h2>모드 · 분량</h2>
    <div class="mode-group">
      <label><input type="radio" name="mode" value="term"> 표제어 제시</label>
      <label><input type="radio" name="mode" value="desc" checked> 설명 제시</label>
      <label><input type="radio" name="mode" value="image"> 이미지 제시</label>
    </div>
    <div class="count-row">
      분량: <input type="number" id="session-count" min="1" value="10"> 문항
      <span id="mode-note" class="note"></span>
    </div>
    <div class="start-row">
      <button id="btn-start" class="primary big">학습 시작</button>
      <button id="btn-wrongnote" class="wrong big">오답 노트</button>
    </div>
    <p id="weight-note" class="hint-center">이미 맞힌 카드는 출제 빈도가 낮아지고 시간이 지나면 다시 올라옵니다</p>
  </div>
</section>

<!-- ===== 학습 화면 ===== -->
<section id="screen-quiz" class="hidden">
  <div class="quiz-header">
    <span id="quiz-progress"></span>
    <button id="btn-quit" class="ghost">중단</button>
  </div>
  <div class="card" id="card">
    <div id="card-front" class="card-face"></div>
    <div id="card-back" class="card-face hidden"></div>
  </div>
  <div class="quiz-controls">
    <button id="btn-reveal" class="primary big">답 보기</button>
    <div id="judge-buttons" class="hidden">
      <button id="btn-correct" class="correct big">⭕ 맞음</button>
      <button id="btn-wrong" class="wrong big">❌ 틀림</button>
    </div>
  </div>
</section>

<!-- ===== 세션 결과 화면 ===== -->
<section id="screen-result" class="hidden">
  <div class="panel center">
    <h2>세션 완료!</h2>
    <p id="result-summary" class="result-big"></p>
    <div id="result-wrong-list"></div>
    <button id="btn-again" class="primary big">새 학습 시작</button>
  </div>
</section>

<!-- ===== 성적 관리 화면 ===== -->
<section id="screen-stats" class="hidden">
  <div class="panel">
    <h2>과목별</h2>
    <table id="stats-subject" class="stats-table"></table>
  </div>
  <div class="panel">
    <h2>유형별</h2>
    <table id="stats-type" class="stats-table"></table>
  </div>
  <div class="panel">
    <h2>태그별</h2>
    <table id="stats-tag" class="stats-table"></table>
  </div>
  <div class="panel">
    <h2>취약 카드 TOP 10 (2회 이상 시도)</h2>
    <table id="stats-weak" class="stats-table"></table>
  </div>
  <div class="panel center">
    <button id="btn-reset" class="wrong">학습 기록 전체 초기화</button>
  </div>
</section>

<script src="app.js"></script>
</body>
</html>
